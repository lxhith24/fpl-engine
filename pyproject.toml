[project]
name = "fpl-engine"
version = "0.1.0"
description = "Fantasy Premier League optimal XI engine with opponent-specific matchup modelling"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "duckdb>=1.0",
    "pulp>=2.7",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "httpx>=0.27",
    "rapidfuzz>=3.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = ["fastapi>=0.110", "uvicorn>=0.27", "anthropic>=0.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: hits real network endpoints; deselect with -m 'not live'",
]
